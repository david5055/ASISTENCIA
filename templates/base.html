<!doctype html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >


    <title>
        {% block title %}DAVIS{% endblock %}
    </title>


    <link
        rel="icon"
        href="data:,"
    >


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >


    <style>

        .topbar-user {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-left: auto;

            font-size: 12px;

        }


        .topbar-user-name {

            opacity: 0.72;

        }


        .logout-link {

            padding: 7px 11px;

            border-radius: 8px;

            border:
                1px solid
                rgba(148, 163, 184, 0.20);

            color: inherit;

            text-decoration: none;

            background:
                rgba(255, 255, 255, 0.04);

        }


        .logout-link:hover {

            border-color:
                rgba(56, 189, 248, 0.55);

            text-decoration: none;

        }


        @media (max-width: 600px) {

            .top-status {

                display: none;

            }


            .topbar-user-name {

                display: none;

            }


            .topbar-user {

                gap: 6px;

            }


            .logout-link {

                padding: 6px 9px;

                font-size: 11px;

            }

        }

    </style>

</head>


<body

    data-davis-authenticated="{{
        '1'
        if session.get('autenticado') and session.get('usuario')
        else '0'
    }}"

    data-davis-session-start="{{
        session.get('inicio_sesion_ms', 0)
    }}"

>


    <header class="topbar">


        <a
            class="brand"
            href="/"
        >
            DAVIS
        </a>


        <span class="top-status">

            Sistema de Registro y Asistencia

        </span>


        {% if session.get("autenticado") and session.get("usuario") %}


            <div class="topbar-user">


                <span class="topbar-user-name">

                    {{ session.get("nombre", session.get("usuario")) }}

                </span>


                <a
                    class="logout-link"
                    href="{{ url_for('auth.logout') }}"
                >
                    Cerrar sesión
                </a>


            </div>


        {% endif %}


    </header>


    <main class="page">


        {% block content %}

        {% endblock %}


    </main>


    <script
        src="{{ url_for('static', filename='app.js') }}"
    ></script>


</body>

</html>
