<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sistema en mantenimiento | DAVIS
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #10253d 0%,
                    #081422 40%,
                    #050b12 100%
                );

            color: white;

            overflow: hidden;

        }


        /* ==========================================
           FONDO
        ========================================== */

        .background {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            overflow: hidden;

        }


        .circle {

            position: absolute;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.16;

        }


        .circle-1 {

            width: 400px;
            height: 400px;

            background: #1f8cff;

            top: -180px;
            left: -100px;

        }


        .circle-2 {

            width: 450px;
            height: 450px;

            background: #00c8ff;

            right: -180px;
            bottom: -200px;

        }


        /* ==========================================
           CONTENEDOR
        ========================================== */

        .maintenance-container {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 650px;

            text-align: center;

            padding: 50px 35px;

        }


        /* ==========================================
           LOGO
        ========================================== */

        .logo {

            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            border-radius: 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #1677ff,
                    #00b8ff
                );

            font-size: 34px;
            font-weight: 800;

            box-shadow:
                0 15px 45px
                rgba(0, 153, 255, 0.25);

        }


        /* ==========================================
           TEXTO SUPERIOR
        ========================================== */

        .system-name {

            font-size: 13px;

            letter-spacing: 4px;

            color: #5ebcff;

            font-weight: 700;

            margin-bottom: 14px;

        }


        h1 {

            font-size: 42px;

            line-height: 1.15;

            margin-bottom: 18px;

        }


        .description {

            max-width: 500px;

            margin: 0 auto;

            color: #9eb1c5;

            line-height: 1.7;

            font-size: 16px;

        }


        /* ==========================================
           CARGADOR
        ========================================== */

        .loader-area {

            margin-top: 42px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 18px;

        }


        .loader {

            width: 58px;
            height: 58px;

            border-radius: 50%;

            border: 5px solid
                rgba(255, 255, 255, 0.10);

            border-top-color: #21a5ff;

            border-right-color: #00d4ff;

            animation:
                girar 0.8s linear infinite;

        }


        @keyframes girar {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* ==========================================
           TEXTO CARGANDO
        ========================================== */

        .loading-text {

            color: #c5d5e5;

            font-size: 14px;

            letter-spacing: 1px;

        }


        .dots span {

            animation:
                punto 1.4s infinite;

            opacity: 0;

        }


        .dots span:nth-child(1) {

            animation-delay: 0s;

        }


        .dots span:nth-child(2) {

            animation-delay: 0.2s;

        }


        .dots span:nth-child(3) {

            animation-delay: 0.4s;

        }


        @keyframes punto {

            0% {

                opacity: 0;

            }

            40% {

                opacity: 1;

            }

            100% {

                opacity: 0;

            }

        }


        /* ==========================================
           ESTADO
        ========================================== */

        .status {

            margin-top: 35px;

            display: inline-flex;

            align-items: center;

            gap: 9px;

            padding:
                10px 16px;

            border:

                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.04
                );

            color: #a8b9ca;

            font-size: 13px;

        }


        .status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #ffb020;

            box-shadow:
                0 0 12px
                rgba(
                    255,
                    176,
                    32,
                    0.8
                );

            animation:
                pulso 1.5s infinite;

        }


        @keyframes pulso {

            0%,
            100% {

                opacity: 1;

                transform:
                    scale(1);

            }

            50% {

                opacity: 0.4;

                transform:
                    scale(0.75);

            }

        }


        /* ==========================================
           PIE
        ========================================== */

        .footer {

            margin-top: 45px;

            font-size: 12px;

            color: #52677d;

        }


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (
            max-width: 600px
        ) {

            .maintenance-container {

                padding:
                    40px
                    15px;

            }


            h1 {

                font-size:
                    31px;

            }


            .description {

                font-size:
                    15px;

            }


            .logo {

                width:
                    70px;

                height:
                    70px;

                font-size:
                    29px;

            }

        }

    </style>

</head>


<body>


    <!-- FONDO -->

    <div class="background">

        <div
            class="
                circle
                circle-1
            "
        ></div>

        <div
            class="
                circle
                circle-2
            "
        ></div>

    </div>



    <!-- CONTENIDO -->

    <main
        class="maintenance-container"
    >


        <!-- LOGO -->

        <div class="logo">
            D
        </div>



        <!-- NOMBRE -->

        <div class="system-name">

            SISTEMA DAVIS

        </div>



        <!-- TÍTULO -->

        <h1>

            Sistema en mantenimiento

        </h1>



        <!-- DESCRIPCIÓN -->

        <p class="description">

            Estamos realizando mejoras
            y actualizaciones en el sistema
            para brindarte un mejor servicio.

            <br>

            Estaremos disponibles nuevamente
            muy pronto.

        </p>



        <!-- CARGANDO -->

        <div class="loader-area">


            <div
                class="loader"
                aria-label="Cargando"
            ></div>


            <div class="loading-text">

                Actualizando sistema

                <span class="dots">

                    <span>.</span>
                    <span>.</span>
                    <span>.</span>

                </span>

            </div>


        </div>



        <!-- ESTADO -->

        <div class="status">

            <span
                class="status-dot"
            ></span>

            Mantenimiento en progreso

        </div>



        <!-- FOOTER -->

        <div class="footer">

            © Sistema DAVIS

        </div>


    </main>


</body>

</html>
